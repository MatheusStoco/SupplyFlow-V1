<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Centros de Custo e Setores · SupplyFlow</title>
  <link rel="icon" href="../static/img/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../static/vendor/bootstrap/bootstrap.min.css">
  <link rel="stylesheet" href="../static/vendor/bootstrap-icons/bootstrap-icons.min.css">
  <link rel="stylesheet" href="../static/css/supplyflow.css">
</head>
<body data-pagina="centros-de-custo">
  <div class="app">

    <div class="sidebar-trilho">
      <aside class="sidebar offcanvas-lg offcanvas-start" tabindex="-1" id="sidebar" aria-label="Menu"></aside>
    </div>

    <div class="app__principal">
      <header class="topbar" id="topbar"></header>

      <main class="conteudo">
        <div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-4">
          <div>
            <h1 class="pagina-titulo mb-1">Centros de Custo e Setores</h1>
            <p class="pagina-descricao mb-0">Estrutura organizacional para rateio e alocação de custos de EPIs e suprimentos.</p>
          </div>
          <div>
            <button type="button" class="btn btn-primary" id="btn-novo-setor">
              <i class="bi bi-folder-plus"></i> Novo Setor / Centro de Custo
            </button>
          </div>
        </div>

        <section class="cartao" aria-label="Lista de setores">
          <div class="table-responsive">
            <table class="tabela-solicitacoes">
              <thead>
                <tr>
                  <th scope="col">Setor / Departamento</th>
                  <th scope="col">Código Centro de Custo</th>
                  <th scope="col">Funcionários Vinculados</th>
                  <th scope="col">Status</th>
                  <th scope="col" class="text-end">Ações</th>
                </tr>
              </thead>
              <tbody id="tabela-setores-corpo">
                <tr><td colspan="5" class="text-center py-4 text-muted">Carregando setores...</td></tr>
              </tbody>
            </table>
          </div>
        </section>
      </main>
    </div>

  </div>

  <!-- Modal Setor -->
  <div class="modal fade" id="modal-setor" tabindex="-1" aria-labelledby="modalSetorTitulo" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content rounded-4 border-0 shadow">
        <form id="form-setor">
          <div class="modal-header border-bottom">
            <h5 class="modal-title fw-bold" id="modalSetorTitulo">Novo Setor</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
          </div>
          <div class="modal-body p-4">
            <input type="hidden" id="setor-id">
            <div class="mb-3">
              <label for="setor-nome" class="form-label small fw-semibold">Nome do Setor / Área *</label>
              <input type="text" id="setor-nome" class="form-control" required placeholder="Ex.: Engenharia de Processos">
            </div>
            <div class="mb-3">
              <label for="setor-cc" class="form-label small fw-semibold">Código do Centro de Custo</label>
              <input type="text" id="setor-cc" class="form-control text-uppercase" placeholder="Ex.: CC-501">
            </div>
          </div>
          <div class="modal-footer border-top">
            <button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancelar</button>
            <button type="submit" class="btn btn-primary px-4 fw-bold">Salvar Setor</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="../static/vendor/bootstrap/bootstrap.bundle.min.js"></script>
  <script src="../static/js/menu.js"></script>
  <script src="../static/js/api.js"></script>
  <script src="../static/js/sessao.js"></script>
  <script src="../static/js/backoffice.js"></script>
  <script>
    (function() {
      var corpo = document.getElementById("tabela-setores-corpo");
      var modalEl = document.getElementById("modal-setor");
      var modalBs = modalEl ? new bootstrap.Modal(modalEl) : null;
      var form = document.getElementById("form-setor");
      var setoresCache = [];

      function carregarSetores() {
        SF.api.get("/api/setores/")
          .then(function(d) {
            setoresCache = d.setores || [];
            if (setoresCache.length === 0) {
              corpo.innerHTML = '<tr><td colspan="5" class="text-center py-4 text-muted">Nenhum setor cadastrado.</td></tr>';
              return;
            }
            corpo.innerHTML = setoresCache.map(function(s) {
              var badge = s.ativo
                ? '<span class="badge bg-success-subtle text-success border border-success-subtle">Ativo</span>'
                : '<span class="badge bg-danger-subtle text-danger border border-danger-subtle">Inativo</span>';
              var esc = SF.escapar;
              return '<tr>' +
                '<td><strong>' + esc(s.nome) + '</strong></td>' +
                '<td><span class="numero">' + esc(s.centro_custo) + '</span></td>' +
                '<td><i class="bi bi-people text-muted me-1" aria-hidden="true"></i> ' + esc(s.total_funcionarios) + ' colaboradores</td>' +
                '<td>' + badge + '</td>' +
                '<td class="text-end text-nowrap">' + (SF.sessao.pode("pessoas")
                  ? '<button type="button" class="btn btn-sm btn-outline-secondary me-1 btn-edit-setor" data-id="' + esc(s.id) + '" aria-label="Editar ' + esc(s.nome) + '"><i class="bi bi-pencil" aria-hidden="true"></i></button>' +
                    '<button type="button" class="btn btn-sm btn-outline-' + (s.ativo ? 'danger' : 'success') + ' btn-toggle-setor" data-id="' + esc(s.id) + '" aria-label="' + (s.ativo ? 'Inativar ' : 'Ativar ') + esc(s.nome) + '"><i class="bi bi-' + (s.ativo ? 'slash-circle' : 'check-circle') + '" aria-hidden="true"></i></button>'
                  : '—') +
                '</td>' +
              '</tr>';
            }).join("");

            document.querySelectorAll(".btn-edit-setor").forEach(function(b) {
              b.addEventListener("click", function() {
                var s = setoresCache.find(function(it) { return it.id === b.dataset.id; });
                if (!s) return;
                document.getElementById("modalSetorTitulo").textContent = "Editar Setor";
                document.getElementById("setor-id").value = s.id;
                document.getElementById("setor-nome").value = s.nome;
                document.getElementById("setor-cc").value = s.centro_custo === "—" ? "" : s.centro_custo;
                if (modalBs) modalBs.show();
              });
            });

            document.querySelectorAll(".btn-toggle-setor").forEach(function(b) {
              b.addEventListener("click", function() {
                SF.api.post("/api/setores/" + encodeURIComponent(b.dataset.id) + "/toggle/")
                  .then(function() { carregarSetores(); })
                  .catch(function(err) { alert(err.message); });
              });
            });
          });
      }

      var btnNovo = document.getElementById("btn-novo-setor");
      if (btnNovo && !SF.sessao.pode("pessoas")) btnNovo.classList.add("d-none");
      if (btnNovo) {
        btnNovo.addEventListener("click", function() {
          form.reset();
          document.getElementById("modalSetorTitulo").textContent = "Novo Setor";
          document.getElementById("setor-id").value = "";
          if (modalBs) modalBs.show();
        });
      }

      if (form) {
        form.addEventListener("submit", function(e) {
          e.preventDefault();
          var payload = {
            id: document.getElementById("setor-id").value || null,
            nome: document.getElementById("setor-nome").value.trim(),
            centro_custo: document.getElementById("setor-cc").value.trim(),
          };
          SF.api.post("/api/setores/salvar/", payload)
            .then(function(res) {
              if (!res.sucesso) throw new Error(res.erro || "Falha ao salvar");
              if (modalBs) modalBs.hide();
              carregarSetores();
            })
            .catch(function(err) { alert(err.message); });
        });
      }

      carregarSetores();
    })();
  </script>
</body>
</html>
