<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cargos e Funções · SupplyFlow</title>
  <link rel="icon" href="../static/img/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../static/vendor/bootstrap/bootstrap.min.css">
  <link rel="stylesheet" href="../static/vendor/bootstrap-icons/bootstrap-icons.min.css">
  <link rel="stylesheet" href="../static/css/supplyflow.css">
</head>
<body data-pagina="cargos">
  <div class="app">

    <div class="sidebar-trilho">
      <aside class="sidebar offcanvas-lg offcanvas-start" tabindex="-1" id="sidebar" aria-label="Menu"></aside>
    </div>

    <div class="app__principal">
      <header class="topbar" id="topbar"></header>

      <main class="conteudo">
        <div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-4">
          <div>
            <h1 class="pagina-titulo mb-1">Cargos e Funções</h1>
            <p class="pagina-descricao mb-0">Estrutura de cargos da organização e vinculação a políticas de fornecimento de EPIs.</p>
          </div>
        </div>

        <section class="cartao" aria-label="Lista de cargos">
          <div class="table-responsive">
            <table class="tabela-solicitacoes">
              <thead>
                <tr>
                  <th scope="col">Cargo / Função</th>
                  <th scope="col">Setor Principal</th>
                  <th scope="col">Colaboradores Ativos</th>
                  <th scope="col">EPIs Obrigatórios Recomendados</th>
                  <th scope="col">Status</th>
                </tr>
              </thead>
              <tbody id="tabela-cargos-corpo">
                <tr><td colspan="5" class="text-center py-4 text-muted">Carregando cargos...</td></tr>
              </tbody>
            </table>
          </div>
        </section>
      </main>
    </div>

  </div>

  <script src="../static/vendor/bootstrap/bootstrap.bundle.min.js"></script>
  <script src="../static/js/dados-demo.js"></script>
  <script src="../static/js/api.js"></script>
  <script src="../static/js/sessao.js"></script>
  <script src="../static/js/backoffice.js"></script>
  <script>
    (function() {
      var corpo = document.getElementById("tabela-cargos-corpo");
      SF.api.get("/api/funcionarios/")
        .then(function(d) {
          var funcs = d.funcionarios || [];
          var cargosMap = {};

          funcs.forEach(function(u) {
            var c = u.cargo || "Geral";
            if (!cargosMap[c]) {
              cargosMap[c] = {
                cargo: c,
                setor: u.setor_nome,
                total: 0,
                ativo: u.ativo
              };
            }
            cargosMap[c].total++;
          });

          var lista = Object.values(cargosMap);
          if (lista.length === 0) {
            corpo.innerHTML = '<tr><td colspan="5" class="text-center py-4 text-muted">Nenhum cargo encontrado.</td></tr>';
            return;
          }

          var episPorCargo = {
            "Soldador": "Luva anticorte, Máscara de solda, Botina",
            "Mecânico": "Óculos de proteção, Luva nitrílica, Protetor auricular",
            "Técnico de Manutenção": "Luva nitrílica, Fita isolante, Multímetro",
            "Operadora de Produção II": "Óculos antirrisco, Protetor auricular, Touca",
            "Eletricista Industrial": "Botina sem partes metálicas, Fita antichama, Luva isolante",
            "Administrador de Sistemas": "Acesso administrativo (sem EPI obrigatório)",
            "Coordenadora de Suprimentos": "EPI de visita técnica em campo",
            "Analista de Almoxarifado": "Botina com bico de aço, Luva de vaqueta",
          };

          corpo.innerHTML = lista.map(function(item) {
            var epis = episPorCargo[item.cargo] || "Luva de proteção, Óculos de segurança";
            return '<tr>' +
              '<td><strong>' + item.cargo + '</strong></td>' +
              '<td>' + item.setor + '</td>' +
              '<td><i class="bi bi-person text-muted me-1"></i> ' + item.total + ' funcionário(s)</td>' +
              '<td class="small text-secondary">' + epis + '</td>' +
              '<td><span class="badge bg-success-subtle text-success border border-success-subtle">Ativo</span></td>' +
            '</tr>';
          }).join("");
        });
    })();
  </script>
</body>
</html>
