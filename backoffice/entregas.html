<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Entregas de Suprimentos · SupplyFlow</title>
  <link rel="icon" href="../static/img/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../static/vendor/bootstrap/bootstrap.min.css">
  <link rel="stylesheet" href="../static/vendor/bootstrap-icons/bootstrap-icons.min.css">
  <link rel="stylesheet" href="../static/css/supplyflow.css">
</head>
<body data-pagina="entregas">
  <div class="app">

    <div class="sidebar-trilho">
      <aside class="sidebar offcanvas-lg offcanvas-start" tabindex="-1" id="sidebar" aria-label="Menu"></aside>
    </div>

    <div class="app__principal">
      <header class="topbar" id="topbar"></header>

      <main class="conteudo">
        <div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-4">
          <div>
            <h1 class="pagina-titulo mb-1">Entregas de Suprimentos</h1>
            <p class="pagina-descricao mb-0">Rastreabilidade de saídas físicas de EPIs e consumíveis confirmadas pelo almoxarifado ou dispensadas no totem.</p>
          </div>
        </div>

        <section class="cartao" aria-label="Lista de entregas">
          <div class="table-responsive">
            <table class="tabela-solicitacoes">
              <thead>
                <tr>
                  <th scope="col">Solicitação</th>
                  <th scope="col">Data/Hora</th>
                  <th scope="col">Colaborador</th>
                  <th scope="col">Setor</th>
                  <th scope="col">Produto Entregue</th>
                  <th scope="col">Qtd.</th>
                  <th scope="col">Local / Totem</th>
                  <th scope="col">Status</th>
                  <th scope="col" class="text-end">Ação</th>
                </tr>
              </thead>
              <tbody id="tabela-entregas-corpo">
                <tr><td colspan="9" class="text-center py-4 text-muted">Carregando registro de entregas...</td></tr>
              </tbody>
            </table>
          </div>
        </section>
      </main>
    </div>

  </div>

  <script src="../static/vendor/bootstrap/bootstrap.bundle.min.js"></script>
  <script src="../static/js/dados-demo.js"></script>
  <script src="../static/js/api.js"></script>
  <script src="../static/js/sessao.js"></script>
  <script src="../static/js/backoffice.js"></script>
  <script>
    (function() {
      var corpo = document.getElementById("tabela-entregas-corpo");

      function carregarEntregas() {
        SF.api.get("/api/entregas/")
          .then(function(d) {
            var entregas = d.entregas || [];
            if (entregas.length === 0) {
              corpo.innerHTML = '<tr><td colspan="9" class="text-center py-4 text-muted">Nenhuma entrega registrada.</td></tr>';
              return;
            }

            corpo.innerHTML = entregas.map(function(e) {
              var badgeStatus = e.entregue
                ? '<span class="selo selo--entregue">Entregue</span>'
                : '<span class="selo selo--aguardando">Aguardando retirada</span>';

              var botaoAcao = !e.entregue
                ? '<button type="button" class="btn btn-sm btn-outline-success btn-confirmar-entrega" data-id="' + e.id + '"><i class="bi bi-check-lg"></i> Confirmar Baixa</button>'
                : '<span class="text-muted small"><i class="bi bi-check2-all text-success"></i> Concluído</span>';

              return '<tr>' +
                '<td><span class="numero">' + e.codigo + '</span></td>' +
                '<td class="text-nowrap small text-muted">' + e.data + '</td>' +
                '<td><strong>' + e.colaborador + '</strong> <span class="small text-muted d-block">Matrícula ' + e.matricula + '</span></td>' +
                '<td>' + e.setor + '</td>' +
                '<td>' + e.produto + '</td>' +
                '<td><strong>' + e.quantidade + '</strong></td>' +
                '<td><span class="badge bg-light text-dark border">' + e.totem + '</span></td>' +
                '<td>' + badgeStatus + '</td>' +
                '<td class="text-end">' + botaoAcao + '</td>' +
              '</tr>';
            }).join("");

            document.querySelectorAll(".btn-confirmar-entrega").forEach(function(btn) {
              btn.addEventListener("click", function() {
                var id = this.dataset.id;
                SF.api.post("/api/entregas/" + encodeURIComponent(id) + "/confirmar/")
                  .then(function() { carregarEntregas(); });
              });
            });
          });
      }

      carregarEntregas();
    })();
  </script>
</body>
</html>
