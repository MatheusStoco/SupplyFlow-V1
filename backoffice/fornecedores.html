<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fornecedores · SupplyFlow</title>
  <link rel="icon" href="../static/img/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../static/vendor/bootstrap/bootstrap.min.css">
  <link rel="stylesheet" href="../static/vendor/bootstrap-icons/bootstrap-icons.min.css">
  <link rel="stylesheet" href="../static/css/supplyflow.css">
</head>
<body data-pagina="fornecedores">
  <div class="app">

    <div class="sidebar-trilho">
      <aside class="sidebar offcanvas-lg offcanvas-start" tabindex="-1" id="sidebar" aria-label="Menu"></aside>
    </div>

    <div class="app__principal">
      <header class="topbar" id="topbar"></header>

      <main class="conteudo">
        <div class="d-flex flex-wrap justify-content-between align-items-start gap-3">
          <div>
            <h1 class="pagina-titulo">Fornecedores</h1>
            <p class="pagina-descricao">Fornecedores de EPIs e consumíveis (RF-05). Cada produto pode indicar seu fornecedor.</p>
          </div>
          <button type="button" class="btn btn-primary d-none" id="btn-novo-fornecedor"><i class="bi bi-plus-lg" aria-hidden="true"></i> Novo fornecedor</button>
        </div>

        <div class="alert d-none" role="status" id="aviso-fornecedores" tabindex="-1"></div>

        <section class="cartao" aria-labelledby="t-fornecedores">
          <div class="cartao__cabecalho"><h2 class="cartao__titulo" id="t-fornecedores">Fornecedores cadastrados</h2></div>
          <div class="table-responsive" tabindex="0" role="region" aria-labelledby="t-fornecedores">
            <table class="tabela-solicitacoes">
              <thead>
                <tr>
                  <th scope="col">Fornecedor</th>
                  <th scope="col">CNPJ</th>
                  <th scope="col">Contato</th>
                  <th scope="col">Produtos</th>
                  <th scope="col">Situação</th>
                  <th scope="col" class="tabela-solicitacoes__acao">Ações</th>
                </tr>
              </thead>
              <tbody id="corpo-fornecedores"><tr><td colspan="6" class="tabela-solicitacoes__vazio">Carregando…</td></tr></tbody>
            </table>
          </div>
        </section>
      </main>
    </div>

  </div>

  <div class="modal fade" id="modal-fornecedor" tabindex="-1" aria-labelledby="titulo-modal-fornecedor" aria-hidden="true">
    <div class="modal-dialog">
      <form class="modal-content" id="form-fornecedor" novalidate>
        <div class="modal-header">
          <h2 class="modal-title fs-5" id="titulo-modal-fornecedor">Fornecedor</h2>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
        </div>
        <div class="modal-body">
          <input type="hidden" id="forn-id">
          <label for="forn-razao" class="form-label fw-semibold">Razão social *</label>
          <input id="forn-razao" class="form-control mb-3" required maxlength="150">
          <label for="forn-fantasia" class="form-label fw-semibold">Nome fantasia</label>
          <input id="forn-fantasia" class="form-control mb-3" maxlength="150">
          <label for="forn-cnpj" class="form-label fw-semibold">CNPJ *</label>
          <input id="forn-cnpj" class="form-control mb-3" required inputmode="numeric" maxlength="18" placeholder="00.000.000/0000-00">
          <div class="row g-2">
            <div class="col-6">
              <label for="forn-email" class="form-label fw-semibold">E-mail</label>
              <input type="email" id="forn-email" class="form-control" maxlength="150">
            </div>
            <div class="col-6">
              <label for="forn-telefone" class="form-label fw-semibold">Telefone</label>
              <input id="forn-telefone" class="form-control" maxlength="30">
            </div>
          </div>
          <label for="forn-contato" class="form-label fw-semibold mt-3">Pessoa de contato</label>
          <input id="forn-contato" class="form-control" maxlength="100">
          <div class="invalid-feedback d-block" id="erro-fornecedor" role="alert"></div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancelar</button>
          <button type="submit" class="btn btn-primary">Salvar</button>
        </div>
      </form>
    </div>
  </div>

  <script src="../static/vendor/bootstrap/bootstrap.bundle.min.js"></script>
  <script src="../static/js/menu.js"></script>
  <script src="../static/js/api.js"></script>
  <script src="../static/js/sessao.js"></script>
  <script src="../static/js/backoffice.js"></script>
  <script src="../static/js/fornecedores.js"></script>
</body>
</html>
